[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The enforced gate. `ruff check app scripts tests` must be zero findings.
#
#   E4/E7/E9 -- import, format-string and syntax mistakes that change behaviour.
#   F        -- pyflakes: unused imports/variables, undefined names, shadowed
#               definitions. F811 is what caught two different tests sharing one
#               name, where the second silently replaced the first and the
#               shadowed case never ran at all.
#   W        -- whitespace hygiene: a missing newline at end of file, trailing
#               whitespace, whitespace-only blank lines. Cosmetic on its own,
#               but it is what a reviewer sees first and it keeps diffs honest.
#
# E501 (line-too-long) is deliberately NOT in this set. ~5,400 pre-existing lines
# exceed 100 characters and splitting them is a formatting decision, not a
# correctness one; reformatting that many files in one change would bury the
# behavioural fixes above it. Line length is owned by the formatter, and this
# file is not a licence to ignore it -- it is a statement that this gate does
# not pretend to enforce it.
select = ["E4", "E7", "E9", "F", "W"]

# Per-file relief, each with the reason it is safe. Nothing here is a blanket
# exemption: every entry names a directory and the code shape that needs it.
[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated code: the migration tool owns their imports
# and their ordering, and an "unused" import there is often how a renamed table
# keeps resolving.
"alembic/versions/*.py" = ["F401"]
# Test modules import fixtures purely to make them visible to pytest, and build
# throwaway objects to assert a constructor rejects them. Both read as unused to
# a static analyser and are load-bearing to the test.
"tests/conftest.py" = ["F401"]
# Script-generated report readers parse JSON blobs whose keys are not known at
# import time; `Any` annotations are the honest type for those.
"scripts/verify_*.py" = ["F401"]

[tool.pytest.ini_options]
# NOTE: pytest configuration lives in the repo's pytest.ini (asyncio mode,
# default fixture loop scope, testpaths), which takes precedence here. Kept empty on purpose;
# see pytest.ini.

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Floor = measured branch coverage of app/ (65.86%) rounded down. Raise it when coverage rises.
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
