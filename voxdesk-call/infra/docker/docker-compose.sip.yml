# SIP ingress edge: carrier TLS terminates at Kamailio, RTPEngine anchors and
# terminates carrier SRTP, and only private UDP/plain RTP reaches the Go media
# gateway. The app still fails closed unless its tenant route resolves.
#
# Required environment:
#   VOXDESK_SIP_GATEWAY_TOKEN  shared secret; must match SIP_GATEWAY_TOKEN
#   VOXDESK_SIP_SIGNAL_HOST    public SIP FQDN/IP in Kamailio Record-Route + TLS cert SAN
#   VOXDESK_SIP_PUBLIC_IP      carrier-reachable IPv4 advertised by RTPEngine
#   VOXDESK_SIP_TLS_CERT_FILE  host path to the ingress certificate/full chain
#   VOXDESK_SIP_TLS_KEY_FILE   host path to the matching private key

services:
  rtpengine:
    build:
      context: ../../services/sip-gateway
      dockerfile: Dockerfile.rtpengine
    environment:
      VOXDESK_SIP_PUBLIC_IP: ${VOXDESK_SIP_PUBLIC_IP:?VOXDESK_SIP_PUBLIC_IP is required}
      VOXDESK_SIP_MEDIA_IP: 172.30.60.4
    ports:
      - "10000-20000:10000-20000/udp"
    networks:
      sip-edge:
        ipv4_address: 172.30.60.4
    restart: unless-stopped

  # Only TLS is published. The Go-facing hop is UDP on sip-edge and is not
  # exposed on the host; Kamailio overwrites the proxy-only source header.
  kamailio:
    build:
      context: ../../services/sip-gateway
      dockerfile: Dockerfile.kamailio
    depends_on:
      - rtpengine
      - sip-gateway
    environment:
      VOXDESK_SIP_SIGNAL_HOST: ${VOXDESK_SIP_SIGNAL_HOST:?VOXDESK_SIP_SIGNAL_HOST is required}
    ports:
      - "5061:5061/tcp"
    volumes:
      - ${VOXDESK_SIP_TLS_CERT_FILE:?VOXDESK_SIP_TLS_CERT_FILE is required}:/run/secrets/voxdesk-sip/tls.crt:ro
      - ${VOXDESK_SIP_TLS_KEY_FILE:?VOXDESK_SIP_TLS_KEY_FILE is required}:/run/secrets/voxdesk-sip/tls.key:ro
    networks:
      sip-edge:
        ipv4_address: 172.30.60.2
    restart: unless-stopped

  # The Go leg is private to the edge and application networks. No SIP or RTP
  # port is published to the host; RTPEngine is the only carrier media edge.
  sip-gateway:
    build:
      context: ../../services/sip-gateway
      dockerfile: Dockerfile
    environment:
      VOXDESK_SIP_GATEWAY_TOKEN: ${VOXDESK_SIP_GATEWAY_TOKEN:?VOXDESK_SIP_GATEWAY_TOKEN is required}
      VOXDESK_SIP_MEDIA_WS_URL: ${VOXDESK_SIP_MEDIA_WS_URL:-ws://api:8000/telephony/sip/ws}
      VOXDESK_SIP_INBOUND_ROUTE_URL: http://api:8000/internal/telephony/sip-inbound-route
      VOXDESK_SIP_HOST: 172.30.60.3
      VOXDESK_SIP_API_ADDR: :8080
      VOXDESK_SIP_PORT: "5060"
      VOXDESK_SIP_CODEC: ${VOXDESK_SIP_CODEC:-PCMU}
      VOXDESK_SIP_ALLOWED_CIDRS: 172.30.60.2/32
      VOXDESK_SIP_TRUSTED_PROXY_CIDRS: 172.30.60.2/32
      VOXDESK_SIP_MEDIA_PEER_CIDRS: 172.30.60.4/32
      VOXDESK_MEDIA_PORT_MIN: "30000"
      VOXDESK_MEDIA_PORT_MAX: "30100"
    networks:
      sip-edge:
        ipv4_address: 172.30.60.3
      sip-app: {}
    restart: unless-stopped

  # Application endpoint for route resolution and the authenticated media
  # WebSocket. Database/Redis/provider settings must be supplied by the
  # deployment environment; this compose file is not staging certification.
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8000:8000/tcp"
    environment:
      SIP_GATEWAY_URL: http://sip-gateway:8080
      SIP_GATEWAY_TOKEN: ${VOXDESK_SIP_GATEWAY_TOKEN:?VOXDESK_SIP_GATEWAY_TOKEN is required}
    depends_on:
      - sip-gateway
    networks:
      - sip-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  sip-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.60.0/24
  sip-app:
    driver: bridge
