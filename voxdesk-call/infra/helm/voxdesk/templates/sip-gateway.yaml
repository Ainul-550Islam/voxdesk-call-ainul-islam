{{- $sip := .Values.sipGateway | default dict }}
{{- $image := $sip.image | default dict }}
{{- $service := $sip.service | default dict }}
{{- $pdb := $sip.podDisruptionBudget | default dict }}
{{- $autoscaling := $sip.autoscaling | default dict }}
{{- if $sip.enabled | default false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voxdesk.fullname" . }}-sip-gateway
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sip-gateway
spec:
  replicas: {{ $sip.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxdesk.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sip-gateway
  template:
    metadata:
      labels:
        {{- include "voxdesk.labels" . | nindent 8 }}
        app.kubernetes.io/component: sip-gateway
    spec:
      terminationGracePeriodSeconds: {{ $sip.terminationGracePeriodSeconds | default 30 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      {{- if $sip.hostNetwork | default false }}
      # The SIP signalling port and the RTP port range are host ports: a
      # carrier sends RTP to the addresses it learned from the SDP, so the
      # range has to be reachable without a port mapper.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: sip-gateway
          image: "{{ required "sipGateway.image.repository is required" $image.repository }}:{{ required "sipGateway.image.tag is required" $image.tag }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: sip
              containerPort: {{ $sip.sipPort | default 5060 }}
              protocol: UDP
            - name: sips
              containerPort: {{ $sip.sipPort | default 5060 }}
              protocol: TCP
            - name: control
              containerPort: {{ $sip.controlPort | default 8080 }}
          env:
            # The shared secret: it authenticates the control API and keys the
            # per-call HMAC session token of the media WebSocket.
            - name: VOXDESK_SIP_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sip.secretName | default "voxdesk-sip-gateway" }}
                  key: token
            # The application's media socket.
            - name: VOXDESK_SIP_MEDIA_WS_URL
              value: {{ required "sipGateway.mediaWsUrl is required" $sip.mediaWsUrl | quote }}
            - name: VOXDESK_SIP_HOST
              value: {{ $sip.host | required "sipGateway.host is required" | quote }}
            - name: VOXDESK_SIP_PORT
              value: {{ $sip.sipPort | default 5060 | quote }}
            - name: VOXDESK_SIP_API_ADDR
              value: ":{{ $sip.controlPort | default 8080 }}"
            - name: VOXDESK_SIP_CODEC
              value: {{ $sip.codec | default "PCMU" | quote }}
            - name: VOXDESK_MEDIA_PORT_MIN
              value: {{ $sip.mediaPortMin | default 30000 | quote }}
            - name: VOXDESK_MEDIA_PORT_MAX
              value: {{ $sip.mediaPortMax | default 30100 | quote }}
          startupProbe:
            httpGet: {path: /healthz, port: control}
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: control}
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: control}
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            {{- toYaml ($sip.resources | default dict) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voxdesk.fullname" . }}-sip-gateway
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sip-gateway
spec:
  # NodePort exposes the SIP signalling port to the carrier. The RTP port
  # range needs the host network (see the deployment above).
  type: {{ $service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: {{ include "voxdesk.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: sip-gateway
  ports:
    - name: sip
      port: {{ $sip.sipPort | default 5060 }}
      protocol: UDP
      targetPort: sip
    - name: sips
      port: {{ $sip.sipPort | default 5060 }}
      protocol: TCP
      targetPort: sips
    - name: control
      port: {{ $sip.controlPort | default 8080 }}
      targetPort: control
{{- if $pdb.enabled | default false }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "voxdesk.fullname" . }}-sip-gateway
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sip-gateway
spec:
  minAvailable: {{ $pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxdesk.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sip-gateway
{{- end }}
{{- if $autoscaling.enabled | default false }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "voxdesk.fullname" . }}-sip-gateway
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: sip-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "voxdesk.fullname" . }}-sip-gateway
  minReplicas: {{ $autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $autoscaling.maxReplicas | default 10 }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
  metrics:
    # The gateway's own call counter: the number of calls it is carrying.
    - type: Pods
      pods:
        metric:
          name: voxdesk_sip_calls_active
        target:
          type: AverageValue
          averageValue: {{ $autoscaling.targetActiveCallsPerPod | default "25" | quote }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
{{- end }}
