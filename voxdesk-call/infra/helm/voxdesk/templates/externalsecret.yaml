{{- /*
ExternalSecret (PART 17B / P17B-01).

Opt-in. When the operator's secret manager is the source of truth, this
renders an ExternalSecret that materialises `secrets.existingSecret` — the same
Secret every other template already reads, so nothing else changes. The chart
never renders a credential value: `remoteRef` names a path in the operator's
store, not a secret.

`creationPolicy: Owner` means deleting the release deletes the materialised
Secret. That is the right default for a chart-managed Secret and the wrong one
for a hand-created one, which is why it is only applied when this template is
the one that created it.
*/ -}}
{{- $es := .Values.externalSecrets | default dict -}}
{{- if $es.enabled | default false }}
{{- if not (($es.secretStoreRef | default dict).name) }}
{{- fail "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled is true: the controller needs to know which store to read" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name | quote }}
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $es.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ required "externalSecrets.data[].remoteRef.key is required" .remoteRef.key }}
        {{- with .remoteRef.property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
