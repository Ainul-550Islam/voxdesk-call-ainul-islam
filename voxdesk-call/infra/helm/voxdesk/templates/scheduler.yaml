{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voxdesk.fullname" . }}-scheduler
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxdesk.name" . }}-scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "voxdesk.name" . }}-scheduler
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds | default 45 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduler
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          command: ["python", "-m", "scripts.scheduler"]
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: DATABASE_URL
              value: {{ required "config.databaseUrl is required" .Values.config.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ required "config.redisUrl is required" .Values.config.redisUrl | quote }}
            - name: SHUTDOWN_DRAIN_TIMEOUT_SECONDS
              value: {{ .Values.scheduler.drain.timeoutSeconds | default 15 | quote }}
            - name: SHUTDOWN_FLUSH_TIMEOUT_SECONDS
              value: {{ .Values.scheduler.drain.flushTimeoutSeconds | default 20 | quote }}
          envFrom:
            - secretRef:
                name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
          # Until PART 17B the scheduler container had NO securityContext: the
          # pod-level `runAsNonRoot` stopped a root container from being
          # scheduled, and nothing stopped this one from escalating or writing
          # to its own image. Same block as the api container, same reason.
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # The scheduler is a background process with no HTTP API. Its only
          # listener is the prometheus_client metrics exporter on
          # SCHEDULER_METRICS_PORT (app/core/config.py:8001), which answers any
          # path, so /metrics doubles as the probe. Without these a hung
          # scheduler looked healthy to Kubernetes: the pod stays Running, the
          # reminders stop, and nothing pages until a customer notices.
          ports:
            - name: metrics
              containerPort: {{ .Values.scheduler.metricsPort | default 8001 }}
          startupProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
{{- if and .Values.scheduler.podDisruptionBudget .Values.scheduler.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "voxdesk.fullname" . }}-scheduler
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.scheduler.podDisruptionBudget.minAvailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "voxdesk.name" . }}-scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
