{{- $serviceAccount := .Values.serviceAccount | default dict -}}
{{- if (dig "create" true $serviceAccount) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "voxdesk.serviceAccountName" . }}
  labels:
    {{- include "voxdesk.labels" . | nindent 4 }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
