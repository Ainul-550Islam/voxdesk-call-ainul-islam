image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 2
service:
  type: ClusterIP
  port: 8000
ingress:
  enabled: false
  className: ""
  host: ""
  tls: []
secrets:
  existingSecret: voxdesk-runtime
config:
  appEnv: production
  databaseUrl: ""
  redisUrl: ""
  trustedHosts: ""
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}
probes:
  readiness: /health/ready
  liveness: /health
scheduler:
  enabled: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
