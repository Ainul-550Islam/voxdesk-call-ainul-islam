services:
  keycloak-idp-test:
    image: quay.io/keycloak/keycloak:26.0.5
    container_name: voxdesk-keycloak-idp-test
    profiles:
      - idp-test
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin-test-only-password
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-voxdesk.json:/opt/keycloak/data/import/realm-voxdesk.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
