name: ci

# The default gate for every push and pull request. Real external-provider
# tests are DELIBERATELY excluded (see real-integrations.yml) — nothing in
# this file may touch the network beyond dependency installation.
#
# `backend` is the fast feedback loop. `full-population` is the one that
# answers "did every collected test actually run?": it enumerates the whole
# population by node id, executes it in chunks, and fails when a collected node
# has no recorded outcome. Its two large artifacts are uploaded, never
# committed — the small digest summary is what lands in git.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voxdesk
          POSTGRES_PASSWORD: voxdesk-ci
          POSTGRES_DB: voxdesk_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voxdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Lint
        run: ruff check app scripts tests

      # Migration round trip against REAL Postgres: upgrade to head, all the
      # way back to base, and up again. A migration that cannot go backwards
      # fails release here, not during a 3am rollback.
      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://voxdesk:voxdesk-ci@localhost:5432/voxdesk_ci

      # tests/webhooks starts its own redis-server on 127.0.0.1 and needs it on PATH.
      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      # Everything except the opt-in real-provider marker. Runs against the real
      # Postgres service so the PG-only probe tests are not silently skipped.
      - name: Tests
        run: python -m pytest -q -m "not real_provider"
        env:
          DATABASE_URL: postgresql+asyncpg://voxdesk:voxdesk-ci@localhost:5432/voxdesk_ci

  # Ruff as its own job: the lint gate must be visible next to the tests, not
  # buried in the first step of a job that takes ten minutes to get there.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install -r requirements-validation.txt

      - name: ruff check (must be zero findings)
        run: ruff check app scripts tests --output-format=github

  # Every collected test, accounted for. This job exists because a test that is
  # collected but never executed is invisible to a "N passed" line, and a suite
  # that quietly stops collecting half its files still says "green".
  full-population:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voxdesk
          POSTGRES_PASSWORD: voxdesk-ci
          POSTGRES_DB: voxdesk_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voxdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Apply migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://voxdesk:voxdesk-ci@localhost:5432/voxdesk_ci

      - name: Install redis-server
        run: sudo apt-get update && sudo apt-get install -y redis-server

      # Node-level chunking: the population is enumerated with --collect-only
      # first, so a chunk never depends on filesystem walk order and no test can
      # be dropped by a chunking accident.
      - name: Run the full collected population
        env:
          DATABASE_URL: postgresql+asyncpg://voxdesk:voxdesk-ci@localhost:5432/voxdesk_ci
        run: |
          python scripts/pytest_chunks.py \
            --chunk-size 40 \
            --per-chunk-timeout 900 \
            --per-test-timeout 240 \
            --marker "not real_provider and not live" \
            --junit-dir reports/check/chunks \
            --summary reports/check/pytest_summary.json \
            --junit-out reports/check/junit/full.xml \
            --results-out reports/check/full_results.json

      # Fails when collected != recorded, and writes the small committed
      # digest summary. The two artifacts stay out of git.
      - name: Reconcile the population against its results
        if: always()
        run: |
          python scripts/reconcile_validation_results.py \
            --results reports/check/full_results.json \
            --junit reports/check/junit/full.xml \
            --summary reports/TEST_EVIDENCE_SUMMARY.json

      - name: Upload test evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-population-evidence
          path: |
            reports/check/junit/full.xml
            reports/check/full_results.json
            reports/check/pytest_summary.json
            reports/TEST_EVIDENCE_SUMMARY.json
          retention-days: 90
          if-no-files-found: error

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/realtime/gateway-go/go.sum

      - name: Go tests (with the race detector)
        working-directory: services/realtime/gateway-go
        run: |
          go vet ./...
          set -o pipefail
          go test -race -count=1 -json ./... | tee /tmp/gateway-tests.jsonl
          python3 -c 'import json; rows=[json.loads(s) for s in open("/tmp/gateway-tests.jsonl")]; assert any(r.get("Action")=="pass" and r.get("Test") for r in rows), "zero passing gateway tests"' 

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install, test, build
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run build

      # Shipped dependencies only; the accepted dev-only Vitest advisory is
      # documented in docs/DEPLOYMENT.md §10.
      - name: Audit production dependencies
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

  frontend-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json

      - name: Install, test, typecheck, build, and audit
        working-directory: dashboard-next
        run: |
          npm ci
          npx vitest run
          npx tsc --noEmit
          npm run build
          npm audit --omit=dev --audit-level=high

  image:
    needs: [backend, gateway, frontend, frontend-next, truth-guards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Full-context build: if .dockerignore regresses and a secret can reach
      # the build, this step is where it would surface.
      - name: Build the API image
        run: docker build . -t voxdesk-api:ci

      - name: Build the realtime gateway image
        run: docker build services/realtime/gateway-go -t voxdesk-realtime-gateway:ci

  truth-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned validation dependencies
        run: pip install -r requirements-validation.txt
      - name: Enforce shrink-only facade history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            python scripts/verify_no_fake_success.py
          else
            python scripts/verify_no_fake_success.py --base-ref "$BASE_REF"
          fi
      - name: Required truth gates
        run: make verify-truth
