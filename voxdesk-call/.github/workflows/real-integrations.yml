name: real-integrations

# Real-provider checks are deliberately isolated from default CI: they may place
# PSTN calls, consume paid STT/LLM/TTS credits, and create/delete CRM sandbox rows.
# The real-provider-tests GitHub Environment is the approval and secret boundary.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run (for example, pre-release or a provider-client change)
        required: false
        default: manual check
      pstn_study_calls:
        description: "Paid PSTN caller-leg study calls (0 disables the study)"
        type: choice
        options:
          - "0"
          - "1"
          - "3"
          - "5"
          - "10"
        required: false
        default: "0"

permissions:
  actions: write
  contents: read

# Never run two jobs against the same test phone number / CRM sandbox at once.
concurrency:
  group: real-integrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: real-provider-tests
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Resolve dated evidence directory
        id: evidence
        run: |
          evidence_date="$(date -u +%F)"
          evidence_dir="evidence/real-integrations/${evidence_date}"
          mkdir -p "$evidence_dir" evidence/junit
          echo "date=${evidence_date}" >> "$GITHUB_OUTPUT"
          echo "dir=${evidence_dir}" >> "$GITHUB_OUTPUT"

      # Refresh the matrix's deterministic Test status using the same exact file
      # set as `make verify-sale`. The generated JUnit timestamps then obey the
      # same seven-day freshness rule as provider evidence.
      - name: Run feature-evidence tests
        id: feature-tests
        continue-on-error: true
        run: |
          python - <<'PY' > "$RUNNER_TEMP/feature-evidence-files.txt"
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path("tests/truth/feature_manifest.yaml").read_text(encoding="utf-8"))
          files = sorted({
              node.split("::", 1)[0]
              for feature in manifest["features"]
              for node in feature.get("evidence_tests", [])
          })
          print("\n".join(files))
          PY
          mapfile -t feature_files < "$RUNNER_TEMP/feature-evidence-files.txt"
          if [[ ${#feature_files[@]} -eq 0 ]]; then
            echo "No feature evidence tests were found in the manifest." >&2
            exit 2
          fi
          TZ=UTC python -m pytest "${feature_files[@]}" \
            --junitxml=evidence/junit/feature_evidence.xml -q

      # `tests/real/` gates itself on VOXDESK_REAL_INTEGRATION plus each provider's
      # required variables. Missing secrets become SKIPPED_NO_CREDENTIALS, never a
      # pass. Do not add live secrets to the ordinary CI workflow.
      - name: Run opt-in real-provider suite
        id: provider-tests
        continue-on-error: true
        run: >-
          python -m pytest tests/real -m real_provider -q -rs
          --junitxml="${VOXDESK_REAL_EVIDENCE_DIR}/junit.xml"
        env:
          VOXDESK_REAL_INTEGRATION: "1"
          VOXDESK_REAL_EVIDENCE_DIR: ${{ steps.evidence.outputs.dir }}

          # Twilio Programmable Voice; the destination must be an owned/verified
          # test number, and the public base URL must point at the test deployment.
          TWILIO_ACCOUNT_SID: ${{ secrets.REAL_TEST_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.REAL_TEST_TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.REAL_TEST_TWILIO_PHONE_NUMBER }}
          TWILIO_TEST_TO_NUMBER: ${{ secrets.REAL_TEST_TWILIO_TEST_TO_NUMBER }}
          VOXDESK_PUBLIC_BASE_URL: ${{ secrets.REAL_TEST_VOXDESK_PUBLIC_BASE_URL }}
          VOXDESK_REAL_API_KEY: ${{ secrets.REAL_TEST_VOXDESK_API_KEY }}

          # Streaming STT, TTS, and LLM providers.
          DEEPGRAM_API_KEY: ${{ secrets.REAL_TEST_DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.REAL_TEST_ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.REAL_TEST_CARTESIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.REAL_TEST_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.REAL_TEST_ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.REAL_TEST_GOOGLE_API_KEY }}

          # Telnyx Call Control v2; the current live test does not assert WS media.
          TELNYX_API_KEY: ${{ secrets.REAL_TEST_TELNYX_API_KEY }}
          TELNYX_CONNECTION_ID: ${{ secrets.REAL_TEST_TELNYX_CONNECTION_ID }}
          TELNYX_FROM_NUMBER: ${{ secrets.REAL_TEST_TELNYX_FROM_NUMBER }}
          TELNYX_TO_NUMBER: ${{ secrets.REAL_TEST_TELNYX_TO_NUMBER }}

          # Internal gateway PCAP smoke test. These must name an already-active
          # controlled lab call; the test captures one second and never dials it.
          VOXDESK_SIP_GATEWAY_URL: ${{ secrets.REAL_TEST_SIP_GATEWAY_URL }}
          VOXDESK_SIP_GATEWAY_TOKEN: ${{ secrets.REAL_TEST_SIP_GATEWAY_TOKEN }}
          VOXDESK_SIP_CAPTURE_TENANT_ID: ${{ secrets.REAL_TEST_SIP_CAPTURE_TENANT_ID }}
          VOXDESK_SIP_CAPTURE_CALL_ID: ${{ secrets.REAL_TEST_SIP_CAPTURE_CALL_ID }}

          # Private object-store smoke test; uses a random key under the PCAP prefix,
          # verifies read/sign/delete, and always attempts cleanup.
          VOXDESK_REAL_PCAP_S3_BUCKET: ${{ secrets.REAL_TEST_PCAP_S3_BUCKET }}
          VOXDESK_REAL_PCAP_S3_REGION: ${{ secrets.REAL_TEST_PCAP_S3_REGION }}
          VOXDESK_REAL_PCAP_S3_ENDPOINT_URL: ${{ secrets.REAL_TEST_PCAP_S3_ENDPOINT_URL }}
          VOXDESK_REAL_PCAP_S3_SIGNING_SECRET: ${{ secrets.REAL_TEST_PCAP_S3_SIGNING_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.REAL_TEST_PCAP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REAL_TEST_PCAP_S3_SECRET_ACCESS_KEY }}

          # Developer CRM sandboxes; tests create uniquely named rows and clean them up.
          SALESFORCE_CLIENT_ID: ${{ secrets.REAL_TEST_SALESFORCE_CLIENT_ID }}
          SALESFORCE_CLIENT_SECRET: ${{ secrets.REAL_TEST_SALESFORCE_CLIENT_SECRET }}
          SALESFORCE_REFRESH_TOKEN: ${{ secrets.REAL_TEST_SALESFORCE_REFRESH_TOKEN }}
          SALESFORCE_INSTANCE_URL: ${{ secrets.REAL_TEST_SALESFORCE_INSTANCE_URL }}
          SALESFORCE_LOGIN_URL: ${{ secrets.REAL_TEST_SALESFORCE_LOGIN_URL }}
          VOXDESK_REAL_HUBSPOT_TOKEN: ${{ secrets.REAL_TEST_HUBSPOT_TOKEN }}

          # Receiver, inspection endpoint, and HMAC secret are all required; the
          # remote receiver must verify the signature and expose its captured request.
          VOXDESK_REAL_WEBHOOK_RECEIVER_URL: ${{ secrets.REAL_TEST_WEBHOOK_RECEIVER_URL }}
          VOXDESK_REAL_WEBHOOK_INSPECT_URL: ${{ secrets.REAL_TEST_WEBHOOK_INSPECT_URL }}
          VOXDESK_REAL_WEBHOOK_SECRET: ${{ secrets.REAL_TEST_WEBHOOK_SECRET }}

      # Paid N-call PSTN analysis is manual-only. A dispatch with 0 calls never
      # adds extra carrier calls; positive input explicitly authorizes that count.
      - name: Run requested N-call PSTN caller-leg study
        id: pstn-study
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.pstn_study_calls != '0' }}
        continue-on-error: true
        env:
          EVIDENCE_DATE: ${{ steps.evidence.outputs.date }}
          PSTN_STUDY_CALLS: ${{ inputs.pstn_study_calls }}
          VOXDESK_REAL_INTEGRATION: "1"
          VOXDESK_REAL_API_KEY: ${{ secrets.REAL_TEST_VOXDESK_API_KEY }}
          VOXDESK_PUBLIC_BASE_URL: ${{ secrets.REAL_TEST_VOXDESK_PUBLIC_BASE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.REAL_TEST_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.REAL_TEST_TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.REAL_TEST_TWILIO_PHONE_NUMBER }}
          TWILIO_TEST_TO_NUMBER: ${{ secrets.REAL_TEST_TWILIO_TEST_TO_NUMBER }}
          DEEPGRAM_API_KEY: ${{ secrets.REAL_TEST_DEEPGRAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.REAL_TEST_OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.REAL_TEST_ELEVENLABS_API_KEY }}
        run: >-
          python scripts/run_real_call_study.py --calls "$PSTN_STUDY_CALLS"
          --date "$EVIDENCE_DATE" --output-dir "evidence/latency/$EVIDENCE_DATE"

      # This writes the provider-by-provider ledger summary and feature matrix even
      # when a live test fails or skips. The following gate, not this report-writing
      # step, determines whether the workflow is green.
      - name: Regenerate evidence and feature status
        id: regenerate-status
        if: always() && steps.evidence.outputs.date != ''
        continue-on-error: true
        env:
          EVIDENCE_DATE: ${{ steps.evidence.outputs.date }}
        run: >-
          python scripts/generate_feature_matrix.py
          --reference-date "$EVIDENCE_DATE" --max-age-days 7

      # Explicit release gate: at least one real provider must have passed, no
      # provider may have failed, JUnit/provider evidence must be <= 7 days old,
      # and the generated docs must exactly match their source artifacts.
      - name: Enforce evidence freshness and generated-doc drift
        id: freshness-gate
        if: always() && steps.evidence.outputs.date != ''
        continue-on-error: true
        env:
          EVIDENCE_DATE: ${{ steps.evidence.outputs.date }}
        run: >-
          python scripts/generate_feature_matrix.py --check
          --require-fresh-real-runs --reference-date "$EVIDENCE_DATE"
          --max-age-days 7

      - name: Upload provider evidence and generated status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-integrations-${{ steps.evidence.outputs.date }}-${{ github.run_id }}
          path: |
            evidence/real-integrations/${{ steps.evidence.outputs.date }}/
            evidence/latency/${{ steps.evidence.outputs.date }}/
            evidence/junit/feature_evidence.xml
            docs/EVIDENCE_STATUS.md
            docs/SALES/FEATURE_MATRIX_VERIFIED.md
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if tests, freshness, or generated status failed
        if: always()
        env:
          FEATURE_TEST_OUTCOME: ${{ steps.feature-tests.outcome }}
          PROVIDER_TEST_OUTCOME: ${{ steps.provider-tests.outcome }}
          STATUS_OUTCOME: ${{ steps.regenerate-status.outcome }}
          FRESHNESS_OUTCOME: ${{ steps.freshness-gate.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          PSTN_STUDY_OUTCOME: ${{ steps.pstn-study.outcome }}
          PSTN_STUDY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.pstn_study_calls != '0' }}
        run: |
          printf 'feature tests: %s\nprovider tests: %s\nstatus generation: %s\nfreshness gate: %s\nevidence setup: %s\n' \
            "$FEATURE_TEST_OUTCOME" "$PROVIDER_TEST_OUTCOME" "$STATUS_OUTCOME" \
            "$FRESHNESS_OUTCOME" "$EVIDENCE_OUTCOME"
          if [[ "$FEATURE_TEST_OUTCOME" != "success" \
             || "$PROVIDER_TEST_OUTCOME" != "success" \
             || "$STATUS_OUTCOME" != "success" \
             || "$FRESHNESS_OUTCOME" != "success" \
             || "$EVIDENCE_OUTCOME" != "success" ]]; then
            echo "Real-provider evidence is failing, absent, stale (>7 days), or docs drifted." >&2
            exit 1
          fi
          if [[ "$PSTN_STUDY_REQUESTED" == "true" && "$PSTN_STUDY_OUTCOME" != "success" ]]; then
            echo "The explicitly requested N-call PSTN study did not complete successfully." >&2
            exit 1
          fi
