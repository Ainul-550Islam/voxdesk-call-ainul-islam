name: real-integrations

# Real external-provider tests (Twilio, Deepgram, ElevenLabs, LLM keys,
# Stripe test mode). These are NEVER part of the default CI path: they cost
# money, need live credentials, and their flakiness must not gate normal
# development. Run them manually before a release or when touching a provider
# client. The tests themselves double-check the opt-in flag and skip without
# it, so even a misfire of this workflow is inert.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run (e.g. 'pre-release', 'twilio webhook refactor')
        required: false
        default: manual check

jobs:
  real-providers:
    runs-on: ubuntu-latest
    environment: real-provider-tests     # hold the secrets behind a GitHub environment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite httpx

      # ONLY the marked tests: `-m real_provider`, guarded again by the
      # environment switch the tests themselves require.
      #
      # Every credential the checks read has to be named here: GitHub injects
      # a stored secret only into the env var this block declares, so a name
      # missing from this list can never leave SKIPPED no matter what the
      # operator configures. All 13 registered providers are mapped below;
      # tests/test_deployment.py fails the build if one is ever dropped.
      - name: Real-provider suite
        run: python -m pytest -q -m real_provider
        env:
          VOXDESK_REAL_INTEGRATION: "1"

          # --- voice plane: telephony, STT, TTS, LLM keys ---
          TWILIO_ACCOUNT_SID: ${{ secrets.REAL_TEST_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.REAL_TEST_TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.REAL_TEST_TWILIO_PHONE_NUMBER }}
          DEEPGRAM_API_KEY: ${{ secrets.REAL_TEST_DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.REAL_TEST_ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.REAL_TEST_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.REAL_TEST_ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.REAL_TEST_GOOGLE_API_KEY }}

          # --- business plane: calendars, CRM, field service ---
          VOXDESK_REAL_GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.REAL_TEST_GOOGLE_CALENDAR_CLIENT_ID }}
          VOXDESK_REAL_GOOGLE_CALENDAR_CLIENT_SECRET: ${{ secrets.REAL_TEST_GOOGLE_CALENDAR_CLIENT_SECRET }}
          VOXDESK_REAL_GOOGLE_CALENDAR_REFRESH_TOKEN: ${{ secrets.REAL_TEST_GOOGLE_CALENDAR_REFRESH_TOKEN }}
          VOXDESK_REAL_GOOGLE_CALENDAR_ACCESS_TOKEN: ${{ secrets.REAL_TEST_GOOGLE_CALENDAR_ACCESS_TOKEN }}
          VOXDESK_REAL_GOOGLE_CALENDAR_CALENDAR_ID: ${{ secrets.REAL_TEST_GOOGLE_CALENDAR_CALENDAR_ID }}
          VOXDESK_REAL_MICROSOFT_CLIENT_ID: ${{ secrets.REAL_TEST_MICROSOFT_CLIENT_ID }}
          VOXDESK_REAL_MICROSOFT_CLIENT_SECRET: ${{ secrets.REAL_TEST_MICROSOFT_CLIENT_SECRET }}
          VOXDESK_REAL_MICROSOFT_REFRESH_TOKEN: ${{ secrets.REAL_TEST_MICROSOFT_REFRESH_TOKEN }}
          VOXDESK_REAL_MICROSOFT_ACCESS_TOKEN: ${{ secrets.REAL_TEST_MICROSOFT_ACCESS_TOKEN }}
          VOXDESK_REAL_MICROSOFT_CALENDAR_ID: ${{ secrets.REAL_TEST_MICROSOFT_CALENDAR_ID }}
          VOXDESK_REAL_CALCOM_API_KEY: ${{ secrets.REAL_TEST_CALCOM_API_KEY }}
          VOXDESK_REAL_CALCOM_BASE_URL: ${{ secrets.REAL_TEST_CALCOM_BASE_URL }}
          VOXDESK_REAL_HUBSPOT_TOKEN: ${{ secrets.REAL_TEST_HUBSPOT_TOKEN }}
          VOXDESK_REAL_GHL_ACCESS_TOKEN: ${{ secrets.REAL_TEST_GHL_ACCESS_TOKEN }}
          VOXDESK_REAL_GHL_LOCATION_ID: ${{ secrets.REAL_TEST_GHL_LOCATION_ID }}
          VOXDESK_REAL_JOBBER_ACCESS_TOKEN: ${{ secrets.REAL_TEST_JOBBER_ACCESS_TOKEN }}

          # --- billing (test mode; read-only shape validation, no charge) ---
          STRIPE_SECRET_KEY: ${{ secrets.REAL_TEST_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.REAL_TEST_STRIPE_WEBHOOK_SECRET }}
