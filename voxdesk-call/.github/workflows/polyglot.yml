name: polyglot

# The gate for the non-Python services introduced by the expansion roadmap
# (`services/README.md` "The polyglot gate"). Each job is one language
# workspace and runs exactly the toolchain that workspace documents in its own
# README — nothing else. The Python backend has its own gate in `ci.yml`; this
# workflow exists because a Rust/C++/Go/TypeScript regression cannot fail a
# workflow that never invokes their compilers.
#
# No job reaches the network beyond dependency installation, and no job needs a
# database, a provider key or a running service: every check here is a build,
# a lint or a test that runs locally the same way.
#
# Every service job uploads a machine-readable artifact (Go: `go test -json`;
# Rust and C++: captured stdout). `polyglot_evidence` then parses all of them
# into reports/POLYGLOT_EVIDENCE_SUMMARY.json, so "the polyglot services pass"
# is a claim backed by a file rather than by a green tick.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: polyglot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Wire contract (Phase 0): the protobuf vocabulary every other job in this
  # file is supposed to speak. Compiles with protoc and cross-checks the enum
  # vocabulary + tenant scoping against app/db/models.py.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio aiosqlite httpx

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Verify the wire contract
        run: python scripts/verify_contracts.py

      - name: Contract tests
        run: python -m pytest tests/test_contracts.py -q

  # Phase 3 — C++ media plane: dependency-free, built and tested with g++ + make.
  media-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run both suites
        working-directory: services/media-plane
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/cpp-tests.log
          test "$(grep -Ec '^[1-9][0-9]* checks, 0 failures$' /tmp/cpp-tests.log)" -eq 2

      - name: Upload C++ test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-media-plane
          path: /tmp/cpp-tests.log
          if-no-files-found: error

  # Phase 2 — Rust control plane (`voxdesk-control` + `voxdesk-signal`).
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Rust gates
        working-directory: services/control-plane
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/rust-tests.log
          grep -Eq "test result: ok\. [1-9][0-9]* passed;" /tmp/rust-tests.log
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-control-plane
          path: /tmp/rust-tests.log
          if-no-files-found: error

  # Go real-time signaling hub — the differential counterpart of
  # `services/control-plane/crates/signal`.
  signal-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/signal-go/go.sum

      - name: Go gates
        working-directory: services/signal-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -json ./... | tee /tmp/go-tests.jsonl
          python3 -c 'import json; rows=[json.loads(s) for s in open("/tmp/go-tests.jsonl")]; assert any(r.get("Action")=="pass" and r.get("Test") for r in rows), "zero passing Go tests"'
          go build ./...

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-signal-go
          path: /tmp/go-tests.jsonl
          if-no-files-found: error

  # Phase 5 — Go ops tooling (`voxops`).
  ops-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/ops/go.mod

      - name: Go gates
        working-directory: services/ops
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -json ./... | tee /tmp/go-tests.jsonl
          python3 -c 'import json; rows=[json.loads(s) for s in open("/tmp/go-tests.jsonl")]; assert any(r.get("Action")=="pass" and r.get("Test") for r in rows), "zero passing Go tests"'
          go build ./...

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-ops-go
          path: /tmp/go-tests.jsonl
          if-no-files-found: error

  # Phase 6 — Go SIP gateway (Kamailio/RTPEngine control plane). Previously
  # absent from this workflow, so a regression in it could not fail CI at all.
  sip-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/sip-gateway/go.sum

      - name: Go gates
        working-directory: services/sip-gateway
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -json ./... | tee /tmp/go-tests.jsonl
          python3 -c 'import json; rows=[json.loads(s) for s in open("/tmp/go-tests.jsonl")]; assert any(r.get("Action")=="pass" and r.get("Test") for r in rows), "zero passing Go tests"'
          go build ./...

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-sip-gateway
          path: /tmp/go-tests.jsonl
          if-no-files-found: error

  # Real-time WebSocket gateway. It has its own job in ci.yml for the Python
  # side; this one builds and tests the Go service itself, which nothing did
  # before.
  gateway-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/realtime/gateway-go/go.sum

      - name: Go gates
        working-directory: services/realtime/gateway-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -json ./... | tee /tmp/go-tests.jsonl
          python3 -c 'import json; rows=[json.loads(s) for s in open("/tmp/go-tests.jsonl")]; assert any(r.get("Action")=="pass" and r.get("Test") for r in rows), "zero passing Go tests"'
          go build ./...

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-gateway-go
          path: /tmp/go-tests.jsonl
          if-no-files-found: error

  # Phase 1 — Next.js/TypeScript admin console.
  dashboard-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json

      - name: Install, test, typecheck, build
        working-directory: dashboard-next
        run: |
          npm ci
          npm test
          npx tsc --noEmit
          npm run build

  media-engine-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Media engine tests must execute
        working-directory: services/realtime/media-engine-rs
        run: |
          cargo test --workspace 2>&1 | tee /tmp/media-tests.log
          grep -Eq "test result: ok\. [1-9][0-9]* passed;" /tmp/media-tests.log

      - name: Upload Rust test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-media-engine-rs
          path: /tmp/media-tests.log
          if-no-files-found: error

  # Parse every artifact above into one summary. A service whose artifact is
  # missing is reported as `missing` and fails this job: a service that never
  # uploaded results is a service that was not proven, and the summary says so
  # instead of quietly averaging over fewer services than it should.
  polyglot_evidence:
    name: polyglot evidence summary
    runs-on: ubuntu-latest
    needs:
      [media-plane, control-plane, signal-go, ops-go, sip-gateway, gateway-go, media-engine-rs]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download polyglot artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/polyglot
          pattern: polyglot-*
          merge-multiple: true

      - name: Build the polyglot evidence summary
        run: python3 scripts/polyglot_evidence.py --artifacts-dir artifacts/polyglot

      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-evidence-summary
          path: reports/POLYGLOT_EVIDENCE_SUMMARY.json
          if-no-files-found: error
