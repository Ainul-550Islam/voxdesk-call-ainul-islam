name: staging-proof

# Real deploy proof. Everything DOCKER_BUILD_SIMULATION.md only described, this
# workflow actually does on a runner with Docker: build the production compose
# stack, migrate it, create an owner, smoke HTTP / signed Twilio webhooks /
# the media WebSocket / the web-call token flow, verify the database, drill a
# backup into a scratch database and restore it, prove the API drains on SIGTERM
# instead of being killed, then tear the stack down.
#
# `make staging-proof` writes evidence/staging/<UTC-date>/ with one raw log per
# command and a staging_proof.json carrying every step's exit code, duration and
# the SHA-256 of its log. This workflow uploads that folder: the evidence is an
# artifact, never a hand-written document.
#
# Manual runs and a weekly schedule; a pull request does not need a full stack
# bring-up on every commit.
on:
  workflow_dispatch:
    inputs:
      keep_stack:
        description: "Leave the stack running for inspection (skip teardown)"
        required: false
        default: "false"
  schedule:
    - cron: "0 3 * * 2"   # Tuesdays 03:00 UTC

concurrency:
  group: staging-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-proof:
    name: deploy proof on the check stack
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      # .env.check holds live-shaped secrets for the throwaway stack. It is
      # generated by the repo's own script (mode 0600) and is git-ignored, so
      # nothing here commits a credential.
      - name: Generate the check environment
        run: |
          if [ -f scripts/make_check_env.py ]; then
            python scripts/make_check_env.py
          else
            cp .env.check.example .env.check
          fi
          test -s .env.check
        env:
          DEMO_OWNER_EMAIL: owner@check.local
          DEMO_OWNER_PASSWORD: VoxCheck!DefaultPass9A

      - name: Show the toolchain
        run: |
          docker --version
          docker compose version

      - name: Run the deploy proof
        id: proof
        env:
          APP_ENV: staging
          DEMO_OWNER_EMAIL: owner@check.local
          DEMO_OWNER_PASSWORD: VoxCheck!DefaultPass9A
          RESTORE_TARGET_DB: voxdesk_restore_drill
        run: |
          set -o pipefail
          make staging-proof $( [ "${{ github.event.inputs.keep_stack }}" = "true" ] && echo SKIP_TEARDOWN=1 ) \
            | tee /tmp/staging-proof.out
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Print the proof summary
        if: always()
        run: |
          proof=$(ls -t evidence/staging/*/staging_proof.json 2>/dev/null | head -1)
          if [ -n "$proof" ]; then
            python3 - "$proof" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          print(f"overall: {doc['overall']}  steps: {len(doc['steps'])}  duration: {doc['duration_seconds']}s")
          for step in doc["steps"]:
              print(f"  [{step['status']:8}] {step['step']} — {step['detail']}")
          PY
          else
            echo "no staging_proof.json was produced" >&2
          fi

      - name: Upload the evidence folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-proof-evidence
          path: evidence/staging/**
          retention-days: 90
          if-no-files-found: warn

      - name: Fail the workflow when the proof did not pass
        if: always()
        run: |
          proof=$(ls -t evidence/staging/*/staging_proof.json 2>/dev/null | head -1)
          test -n "$proof" || { echo "no proof file" >&2; exit 1; }
          python3 - "$proof" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          sys.exit(0 if doc["overall"] == "PASS" else 1)
          PY
