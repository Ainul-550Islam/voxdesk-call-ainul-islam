name: security-scan

# Supply-chain, SAST, secret, polyglot dependency, and container image scanning.
# Runs alongside CI on every push/PR and weekly on a schedule (dependency CVEs
# appear after a commit, not at it). Fails on HIGH/CRITICAL findings and uploads
# SARIF reports to GitHub Code Scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SAST: bandit scans our code (app/, scripts/) — never vendored
      # dependencies. Fails on medium/high/critical severity findings and emits SARIF.
      - name: Bandit (Python SAST)
        run: |
          pip install bandit[sarif]
          bandit -c pyproject.toml -r app scripts -lll -f sarif -o bandit-results.sarif
          bandit -c pyproject.toml -r app scripts -q

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif
          category: bandit-sast

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-audit with the documented accepted-risk list (docs/SECURITY.md).
      - name: pip-audit (Python dependency CVEs)
        run: |
          pip install pip-audit
          bash scripts/audit_dependencies.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (dashboard-next high/critical CVEs)
        working-directory: dashboard-next
        run: |
          npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@1.90.0

      - name: cargo audit (Rust workspaces high/critical CVEs)
        run: |
          cargo install cargo-audit --locked
          (cd services/control-plane && cargo audit --deny warnings)
          (cd services/realtime/media-engine-rs && cargo audit --deny warnings)

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: govulncheck (Go services vulnerability check)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          (cd services/signal-go && govulncheck ./...)
          (cd services/ops && govulncheck ./...)

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # gitleaks with full history: a secret deleted in a later commit is
      # still a leaked secret.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  trivy-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image for Trivy scan
        run: |
          docker build -t voxdesk-call:security-scan .

      - name: Run Trivy vulnerability scanner (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "voxdesk-call:security-scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy-image
