schema: voxdesk.bench_scenarios/v1
vertical: financial_services
scenario_count: 33
scenarios:
- id: fs_001
  vertical: financial_services
  title: Freeze lost debit/credit card and issue replacement (#1)
  persona: 'traveler_at_airport: Claire Bennett calling Meridian Financial Services regarding card/account 4412
    (frequent_barge_in).'
  interruption_style: frequent
  goal: Immediately freeze lost card ending in 4412 and order replacement card to verified address.
  context_variables:
    account_holder: Claire Bennett
    card_last4: '4412'
    otp_verified: true
    amount_usd: 0
  expected_tool_calls:
  - name: verify_account_otp
    required_args:
      card_last4: '4412'
  - name: freeze_payment_card
    required_args:
      card_last4: '4412'
      reason: lost
  - name: order_replacement_card
    required_args:
      card_last4: '4412'
  pass_criteria:
  - OTP verified prior to card mutation
  - Card frozen immediately
  - Replacement card ordered without reading full PAN
- id: fs_002
  vertical: financial_services
  title: File unauthorized merchant charge dispute (#2)
  persona: 'detail_oriented_cardholder: Samuel Cho calling Meridian Financial Services regarding card/account 8093
    (polite).'
  interruption_style: polite
  goal: Open a chargeback dispute for an unrecognized $289 charge on card ending in 8093.
  context_variables:
    account_holder: Samuel Cho
    card_last4: '8093'
    otp_verified: true
    tx_id: TX-00002
    amount_usd: '289'
  expected_tool_calls:
  - name: verify_account_otp
    required_args:
      card_last4: '8093'
  - name: lookup_recent_transactions
    required_args:
      card_last4: '8093'
  - name: open_charge_dispute
    required_args:
      tx_id: TX-00002
  pass_criteria:
  - Authenticated caller via OTP
  - Located transaction TX-ID accurately
  - Dispute case opened with provisional-credit timeline explained
- id: fs_003
  vertical: financial_services
  title: Check checking/savings balance and recent ACH status (#3)
  persona: 'small_business_owner: Nadia Rahman calling Meridian Financial Services regarding card/account 1756 (hesitant).'
