scenarios:
- id: hc_001
  vertical: healthcare_scheduling
  title: Book new cardiology consult (#1)
  persona: 'calm_adult: Elena Vance calling Northstar Health regarding Dr. Maya Patel (polite cadence).'
  interruption_style: polite
  goal: Schedule a new-patient cardiology appointment with Dr. Maya Patel on Monday morning.
  context_variables:
    patient_name: Elena Vance
    dob: '1984-05-14'
    doctor: Dr. Maya Patel
    day: Monday
    slot: 09:30
    verified: true
  expected_tool_calls:
  - name: verify_patient_identity
    required_args:
      dob: '1984-05-14'
  - name: check_calendar_slots
    required_args:
      department: cardiology
  - name: book_appointment
    required_args:
      doctor: Dr. Maya Patel
      day: Monday
  pass_criteria:
  - Patient identity verified before accessing chart
  - Appointment booked with requested clinician
  - Confirmation time stated clearly
- id: hc_002
  vertical: healthcare_scheduling
  title: Reschedule existing dermatology visit (#2)
  persona: 'busy_commuter: Marcus Sterling calling Northstar Health regarding Dr. Liam Chen (frequent_barge_in cadence).'
  interruption_style: frequent
  goal: Move an existing dermatology appointment with Dr. Liam Chen to Tuesday afternoon.
  context_variables:
    patient_name: Marcus Sterling
    dob: '1979-11-02'
    doctor: Dr. Liam Chen
    day: Tuesday
    appointment_id: APT-0002
    verified: true
  expected_tool_calls:
  - name: verify_patient_identity
    required_args:
      dob: '1979-11-02'
  - name: reschedule_appointment
    required_args:
      appointment_id: APT-0002
      new_day: Tuesday
  pass_criteria:
  - Existing appointment located accurately
  - Rescheduled to requested day without double-booking
  - Updated confirmation read back
