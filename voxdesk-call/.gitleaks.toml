# VoxDesk secret-scan configuration.
#
# Read by .github/workflows/security-scan.yml (job `secret-scan`, which runs
# gitleaks/gitleaks-action@v2), and by anyone running `gitleaks git .` locally:
# gitleaks discovers a config at (target path)/.gitleaks.toml unless
# --config / GITLEAKS_CONFIG overrides it.
#
# WHY THIS FILE EXISTS
# --------------------
# The default gitleaks ruleset is tuned for application code, not for test
# fixtures. On this repository it reported 32 findings, and all 32 are planted
# dummy values inside unit/integration tests - values the product's own
# redaction tests exist to mask. For example `sk_live_LEAKED123` in
# dashboard/tests/audit.test.jsx is the *input* to a test asserting that the
# audit UI never paints a credential into the DOM, and
# services/realtime/gateway-go/internal/auth/jwt_test.go uses the literal
# 0123456789abcdef0123456789abcdef as a signing key for a test JWT.
#
# Without an allowlist the CI job `secret-scan` failed on every push for
# findings nobody should act on, which is how a security gate quietly becomes
# something people ignore. The accepted-risk reasoning is documented in
# AUDIT-REPORT.md, problem 17.
#
# WHAT IS STILL SCANNED
# ---------------------
# Everything except the test trees listed below, with every default rule:
# app/, scripts/, services/ (non-test files), dashboard/src/, dashboard/*.js,
# infra/, contracts/, sdk/, docs/, the repo root, and the full git history.
# The allowlist affects only which *findings are reported*, not which files
# are visited.
#
# MAINTENANCE
# -----------
# If a genuine credential is ever pasted into a test file, do not rely on this
# allowlist to hide it: move the value to an environment variable and read it
# in the test. The allowlist is for literals that are *by design* not secrets.

[extend]
# Keep every default rule and its severity; add project rules below this line
# if a VoxDesk-specific pattern is ever needed.
useDefault = true

[[allowlists]]
description = "Planted dummy values in Python unit/integration tests (tests/, including nested trees such as tests/auth/, tests/qa/, tests/security/)."
paths = ['''(^|/)tests?/''']

[[allowlists]]
description = "Planted dummy values in the frontend test tree (dashboard/tests/)."
paths = ['''(^|/)dashboard/tests/''']

[[allowlists]]
description = "Go test files (services/**/*_test.go and friends): fixed JWT signing keys, fake API tokens, gateway fixtures."
paths = ['''_test\.go$''']
