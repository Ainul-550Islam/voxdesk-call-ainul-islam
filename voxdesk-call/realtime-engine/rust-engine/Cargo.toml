[package]
name = "voxdesk-realtime-engine"
version = "1.0.0"
edition = "2021"
description = "Real-time WebSockets & Concurrency Engine for hundreds of voice calls, WebRTC/LiveKit signaling, high-speed data streams — 10-25MB, 10K-20K lines"
authors = ["VoxDesk Team"]
license = "Proprietary"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"
flume = "0.11"
bytes = "1.5"
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webrtc = "0.9"
livekit-api = "0.3"
livekit-protocol = "0.3"
prometheus = "0.13"
jsonwebtoken = "8.3"
argon2 = "0.5"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
config = "0.13"
clap = { version = "4.4", features = ["derive"] }
rustls = "0.22"
tokio-rustls = "0.26"
webpki-roots = "0.26"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
redis = { version = "0.24", features = ["tokio-comp"] }
lapin = "2.3"
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
