# Development reverse proxy. Production TLS and realtime routing stay in the
# reviewed Caddyfile; this file gives the local Compose stack one browser origin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream voxdesk_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/(?:api|auth|telephony|channels|messaging|public|webhooks|scim|sso|widget|ws)(?:/|$) {
        proxy_pass http://voxdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    location = /health {
        proxy_pass http://voxdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /health/ {
        proxy_pass http://voxdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(?:docs|redoc|openapi\.json|metrics|\.well-known|robots\.txt|sitemap\.xml|security\.txt)(?:/|$) {
        proxy_pass http://voxdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The retired Vite console used to be proxied here on :5173 (its service was
    # deleted with `dashboard/` in P10-05). `/` now goes to the API, which answers it
    # only when a static export is present in the image; under P17A-03 the console is
    # a Node server and is NOT statically exported, so run `npm run dev` inside
    # `dashboard-next/` for the UI (docs/DEPLOYMENT.md) and use this origin for the
    # API paths, which are all of `/api`, `/auth`, `/ws`, `/health` and `/metrics`.
    location / {
        proxy_pass http://voxdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
