# Development reverse proxy. Production TLS and realtime routing stay in the
# reviewed Caddyfile; this file gives the local Compose stack one browser origin.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream voxdesk_api {
    server api:8000;
}

upstream voxdesk_dashboard {
    server dashboard:5173;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ ^/(?:api|auth|telephony|channels|messaging|public|webhooks|scim|sso|widget|ws)(?:/|$) {
        proxy_pass http://voxdesk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    location = /health {
        proxy_pass http://voxdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /health/ {
        proxy_pass http://voxdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(?:docs|redoc|openapi\.json|metrics|\.well-known|robots\.txt|sitemap\.xml|security\.txt)(?:/|$) {
        proxy_pass http://voxdesk_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://voxdesk_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
}
