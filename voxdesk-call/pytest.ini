[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    unit: pure unit tests — no network, no external provider
    integration: mocked-provider integration tests — no real network
    real_provider: real external provider tests — opt-in, requires VOXDESK_REAL_INTEGRATION=1
    live: opt-in externally configured provider verification
    slow: explicitly classified resource-intensive test
    docker: live Docker stack smoke tests — requires running voxdesk-check compose stack
