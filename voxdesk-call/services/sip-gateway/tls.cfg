# TLS server profile for the carrier-facing SIP listener. Mount a certificate
# whose SAN covers the SIP ingress hostname and its matching private key at the
# paths below. Carrier client certificates are optional; tenant/source
# authorization is performed by the authenticated application route.
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /run/secrets/voxdesk-sip/tls.key
certificate = /run/secrets/voxdesk-sip/tls.crt

# The ingress configuration currently has no outbound carrier route. Keep
# verification enabled so a future TLS client leg cannot silently downgrade
# or accept an untrusted certificate chain.
[client:default]
method = TLSv1.2+
verify_certificate = yes
require_certificate = yes
ca_list = /etc/ssl/certs/ca-certificates.crt
