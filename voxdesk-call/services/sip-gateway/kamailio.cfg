#!KAMAILIO
# SIP TLS ingress edge. Carrier signalling terminates here; INVITEs are
# forwarded over private UDP to the Go gateway. RTPEngine anchors media and
# exposes only a public SRTP/RTP leg; the Go leg remains private plain RTP.

####### Global Parameters #########
debug=2
log_stderror=yes
memdbg=5
memlog=5
children=4
enable_tls=yes

# Carrier signalling uses TLS. The UDP SIP socket is only used for the
# container-to-container hop on sip-edge and is intentionally not published.
listen=tls:0.0.0.0:5061 advertise @VOXDESK_SIP_SIGNAL_HOST@:5061
listen=udp:0.0.0.0:5060

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "tls.so"
loadmodule "rtpengine.so"

# tls.cfg contains required server cert/key paths and a certificate-verifying
# client profile. Outbound carrier routing is not enabled by this ingress-only
# route yet.
modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine:22222")

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # ACK and in-dialog requests follow the Record-Route set. Do not accept
    # arbitrary in-dialog requests without a route back to this edge.
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE|CANCEL")) {
                rtpengine_delete();
            }
            if (is_method("INVITE|UPDATE") && has_body("application/sdp")) {
                if ($si == "172.30.60.3") {
                    if (!rtpengine_manage("replace-origin ICE=remove RTP/AVP direction=internal direction=external")) {
                        sl_send_reply("503", "Media Relay Unavailable");
                        exit;
                    }
                } else {
                    if (!rtpengine_manage("replace-origin ICE=remove RTP/AVP direction=external direction=internal")) {
                        sl_send_reply("503", "Media Relay Unavailable");
                        exit;
                    }
                }
                t_on_reply("MANAGE_MEDIA_REPLY");
            }
            if (!t_relay()) {
                sl_reply_error();
            }
            exit;
        }
        if (is_method("ACK")) {
            # ACK for a non-2xx INVITE has no dialog route set, but must still
            # be forwarded by the matching transaction to the Go UAS.
            if (t_check_trans()) {
                if (!t_relay()) {
                    sl_reply_error();
                }
            }
            exit;
        }
        sl_send_reply("404", "Dialog Route Not Found");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            rtpengine_delete();
            if (!t_relay()) {
                sl_reply_error();
            }
        }
        exit;
    }

    if (is_method("OPTIONS")) {
        $du = "sip:sip-gateway:5060";
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "VoxDesk SIP INVITE call_id=$ci from=$fu to=$tu src_ip=$si\n");

        # Strip all caller-controlled copies and replace with the socket source.
        # Go trusts this field only from the explicit Kamailio CIDR.
        remove_hf("X-VoxDesk-Source-IP");
        append_hf("X-VoxDesk-Source-IP: $si\r\n");
        record_route();

        if (!has_body("application/sdp")) {
            sl_send_reply("488", "SDP Required");
            exit;
        }
        # Force a plain RTP/AVP offer only on the private Go leg. RTPEngine
        # retains/negotiates the carrier-side SRTP profile; the response route
        # restores that profile toward the carrier.
        if (!rtpengine_manage("replace-origin ICE=remove RTP/AVP direction=external direction=internal")) {
            sl_send_reply("503", "Media Relay Unavailable");
            exit;
        }
        t_on_reply("MANAGE_MEDIA_REPLY");
        $du = "sip:sip-gateway:5060";
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

onreply_route[MANAGE_MEDIA_REPLY] {
    if (t_check_status("18[0-9]|2[0-9][0-9]")) {
        if (has_body("application/sdp")) {
            # The answer comes from the private RTP/AVP Go leg. RTPEngine uses
            # the initial offer state to generate the carrier-facing profile.
            if (!rtpengine_manage("replace-origin ICE=remove direction=internal direction=external")) {
                xlog("L_ERR", "RTPEngine could not rewrite SDP for call_id=$ci; dropping reply\n");
                drop;
            }
        }
    }
    if (t_check_status("[3-6][0-9][0-9]")) {
        rtpengine_delete();
    }
}
