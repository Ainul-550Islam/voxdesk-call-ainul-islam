#!KAMAILIO
# VoxDesk SIP Ingress Gateway Configuration (ADR-001 / Sub-Phase 2F)

####### Global Parameters #########
debug=2
log_stderror=yes
memdbg=5
memlog=5
children=4
enable_tls=yes

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "rtpengine.so"

modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK - VoxDesk SIP Gateway Ready");
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "VoxDesk SIP INVITE call_id=$ci from=$fu to=$tu src_ip=$si\n");
        record_route();
        rtpengine_manage("replace-origin replace-session-connection ICE=remove RTP/AVP");
        t_relay();
        exit;
    }

    if (is_method("BYE|CANCEL")) {
        rtpengine_delete();
        t_relay();
        exit;
    }
}
