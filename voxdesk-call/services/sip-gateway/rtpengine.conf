[rtpengine]
# Userspace forwarding keeps the edge image free of kernel-module and
# NET_ADMIN requirements. Production capacity must be benchmarked separately.
table = -1

# These values are rendered by rtpengine-entrypoint.sh from validated IPv4
# addresses supplied by the deployment. The external address is the public
# address on which carrier RTP/SRTP can reach the published UDP port range;
# the internal address is the private edge-network address shared with Go.
interface = external/@VOXDESK_SIP_MEDIA_IP@!@VOXDESK_SIP_PUBLIC_IP@;internal/@VOXDESK_SIP_MEDIA_IP@
listen-ng = @VOXDESK_SIP_MEDIA_IP@:22222

port-min = 10000
port-max = 20000
log-level = 6
log-stderr = true
foreground = true
timeout = 60
silent-timeout = 3600
