# Dev compose — local development only, NOT production.
# Production uses docker-compose.prod.yml (Postgres/Redis stay private and Caddy
# terminates TLS). Password defaults below are deliberately development-only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxdesk-dev-only-do-not-use-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-voxdesk}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxdesk}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxdesk}:${POSTGRES_PASSWORD:-voxdesk-dev-only-do-not-use-in-prod}@db:5432/${POSTGRES_DB:-voxdesk}
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voxdesk}:${POSTGRES_PASSWORD:-voxdesk-dev-only-do-not-use-in-prod}@db:5432/${POSTGRES_DB:-voxdesk}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./scripts:/srv/scripts
      - ./secrets:/srv/secrets
    # The API owns migrations; start the worker directly like production.
    entrypoint: ["python", "-m", "scripts.scheduler"]
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    working_dir: /srv
    volumes: ["./dashboard:/srv"]
    ports: ["5173:5173"]
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    depends_on: [api]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      api: {condition: service_started}
      dashboard: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
