# Dev compose — local development only, NOT production
# RISK-02 Fix: static DB password voxdesk is dev-only, clearly non-reusable, injected from env
# Production compose (docker-compose.prod.yml) uses environment-required secrets
# Dev password is overridable via POSTGRES_PASSWORD env var, defaults to dev-only value
# Never reuse this password in production — prod requires POSTGRES_PASSWORD from .env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxdesk-dev-only-do-not-use-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-voxdesk}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxdesk}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  scheduler:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./scripts:/srv/scripts
      - ./secrets:/srv/secrets
    command: python -m scripts.scheduler
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    working_dir: /srv
    volumes: ["./dashboard:/srv"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [api]
    environment:
      VOXDESK_ALLOW_ALL_HOSTS: "true"

volumes:
  pgdata:
