[package]
name = "voxdesk-concurrency-engine"
version = "1.0.0"
edition = "2021"
description = "VoxDesk Concurrency Engine — Real-time WebSockets & Concurrency Engine — 10-25MB, 10K-20K lines — hundreds of voice calls, WebRTC/LiveKit signaling, high-speed data stream"
authors = ["VoxDesk Team <team@voxdesk.ai>"]
license = "Proprietary"
repository = "https://github.com/voxdesk/concurrency-engine"
keywords = ["webrtc", "livekit", "websocket", "concurrency", "voice", "realtime"]
categories = ["network-programming", "concurrency", "multimedia"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
actix-web = { version = "4.4", features = ["rustls-0_22"] }
actix-ws = "0.3"
actix-rt = "2.9"
actix = "0.13"
axum = { version = "0.7", features = ["ws", "macros"] }
tungstenite = "0.21"
tokio-tungstenite = "0.21"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
config = "0.13"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"
flume = "0.11"
bytes = "1.5"
webrtc = "0.9"
livekit-api = "0.3"
livekit-protocol = "0.3"
livekit = "0.3"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
lapin = "2.3"
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
jsonwebtoken = "8.3"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
thiserror = "1.0"
anyhow = "1.0"
rustls = "0.22"
tokio-rustls = "0.26"
webpki-roots = "0.26"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.12"
ringbuf = "0.3"
rtrb = "0.2"
opus = "0.3"
webrtc-media = "0.8"
interceptor = "0.11"
tokio-util = { version = "0.7", features = ["codec"] }
bytestring = "1.3"
smallvec = "1.13"
ahash = "0.8"
once_cell = "1.19"
lazy_static = "1.4"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
mockall = "0.11"
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
