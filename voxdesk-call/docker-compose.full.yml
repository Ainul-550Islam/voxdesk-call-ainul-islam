# Development composition; production deployment uses docker-compose.prod.yml.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxdesk-dev-only-do-not-use-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-voxdesk}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxdesk}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports: ["8000:8000", "9090:9090"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  scheduler:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./scripts:/srv/scripts
      - ./secrets:/srv/secrets
    command: python -m scripts.scheduler
    restart: unless-stopped

  # Development frontend: the Next dev server on the same tree the production
  # image builds (PART 17A). The retired Vite app used to live here on :5173.
  #
  # It runs from the source mount rather than the image because hot reload is the
  # point of this file; `npm run dev` binds 0.0.0.0 so the port reaches the host.
  # API calls are relative (`/api/…`), so the browser needs one origin: open
  # http://localhost:3000 and let this container talk to `api` over the compose
  # network. Set NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 only if you are
  # browsing a static build served by something other than this app.
  dashboard:
    image: node:20-alpine
    working_dir: /srv/dashboard-next
    volumes:
      - ./dashboard-next:/srv/dashboard-next
      - ./sdk/web:/srv/sdk/web
    ports: ["3000:3000"]
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on: [api]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0

  livekit:
    image: livekit/livekit-server:latest
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    command: --dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
  redisdata:
