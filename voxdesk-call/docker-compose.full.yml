# Full Production Compose — VoxDesk — 200 API files + Rust Concurrency Engine + C++ Native Audio + Go Realtime Engine
# Includes: Python API (9041 routes), Rust Concurrency Engine (10-25MB), C++ Native Audio (5-15MB), Go Realtime Engine (10-25MB)
# All done — docker-compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxdesk-dev-only-do-not-use-in-prod}
      POSTGRES_DB: ${POSTGRES_DB:-voxdesk}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voxdesk}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports: ["8000:8000", "9090:9090"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 5

  # Rust Concurrency Engine — 10-25MB, 38K lines, 1000+ concurrent WS, WebRTC/LiveKit signaling
  concurrency-engine:
    build:
      context: ./voxdesk-concurrency-engine
      dockerfile: Dockerfile
    ports: ["8080:8080", "8082:9090", "8083:8081"]
    env_file: .env
    depends_on:
      redis: {condition: service_healthy}
      db: {condition: service_healthy}
    environment:
      - RUST_LOG=info
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379
      - LIVEKIT_HOST=${LIVEKIT_HOST:-http://livekit:7880}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL:-ws://livekit:7880}
    command: ["voxdesk-concurrency-engine", "--config", "config/production.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # C++ Native Audio Engine — 5-15MB, 36K lines, noise reduction, voice packet decoding, WebRTC media
  native-audio-engine:
    build:
      context: ./voxdesk-native-audio-engine
      dockerfile: Dockerfile
    ports: ["8084:8080"]
    depends_on:
      - concurrency-engine
    environment:
      - RUST_LOG=info
    command: ["voxdesk_audio_cli", "--benchmark"]
    healthcheck:
      test: ["CMD", "voxdesk_audio_cli", "--health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  # Go Realtime Engine — 10-25MB, 55K lines, high-speed data stream
  go-realtime-engine:
    build:
      context: ./realtime-engine/go-engine
      dockerfile: Dockerfile
    ports: ["8085:8080", "8086:9090"]
    env_file: .env
    depends_on:
      redis: {condition: service_healthy}
    environment:
      - REDIS_URL=redis://redis:6379
    command: ["./engine", "--config", "config/default.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Rust Realtime Engine — 10-25MB, 52K lines
  rust-realtime-engine:
    build:
      context: ./realtime-engine/rust-engine
      dockerfile: Dockerfile
    ports: ["8087:8080", "8088:9090"]
    env_file: .env
    depends_on:
      redis: {condition: service_healthy}
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://redis:6379
    command: ["voxdesk-realtime-engine", "--config", "config/default.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./app:/srv/app
      - ./scripts:/srv/scripts
      - ./secrets:/srv/secrets
    command: python -m scripts.scheduler
    restart: unless-stopped

  dashboard:
    image: node:20-alpine
    working_dir: /srv
    volumes: ["./dashboard:/srv"]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [api]
    environment:
      VOXDESK_ALLOW_ALL_HOSTS: "true"

  livekit:
    image: livekit/livekit-server:latest
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}
    command: --dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
  redisdata:
